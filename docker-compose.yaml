services:
  web:
    build: ./frontend
    networks:
      - art_network
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_API_URL=/api
      # optional internal runtime url for server-side use (if needed)
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend

      
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always
    networks:
      - art_network
  
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: art
    networks:
      - art_network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - backend
    networks:
      - art_network
    restart: always
    
networks:
  art_network:
